name: Deploy Worker (sync)

# D\u00e9ploiement du Worker Cloudflare de synchronisation multi-appareils (Phase 3).
# Ce Worker ne stocke que du ciphertext (AES-256-GCM c\u00f4t\u00e9 client).
#
# Secrets GitHub requis :
#   CLOUDFLARE_ACCOUNT_ID  \u2014 ID du compte Cloudflare
#   CLOUDFLARE_API_TOKEN   \u2014 Token API avec permissions Workers + D1 + R2

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-worker:
    name: D\u00e9ploiement Worker Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Non-bloquant tant que les secrets Cloudflare ne sont pas configur\u00e9s.
    continue-on-error: true
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck Worker
        run: npx tsc --noEmit

      - name: Migrate D1 (schema)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute velora-sync --file=./schema.sql --remote || true

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
