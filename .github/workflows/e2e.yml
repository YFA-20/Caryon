name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  # Ne pas annuler un run E2E en cours quand on push un nouveau commit :
  # les tests Playwright prennent ~10 min et un push intermédiaire (ex:
  # fix CI) ne doit pas les interrompre. Le dernier run de la PR gagne.
  cancel-in-progress: false

jobs:
  playwright:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    # 20 min ne suffit pas : la suite complète (3 projets × ~80 tests avec
    # retries) dépasse ce délai et GitHub annule le job en CANCELLED.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (reproductible)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # `test:e2e` construit d'abord l'app en mode test E2E
      # (NEXT_PUBLIC_E2E_TEST_BUILD=1 -> KDF allégé Argon2id 64 KiB, t=1).
      # Le build de production (deploy.yml) n'utilise JAMAIS ce flag :
      # le KDF reste Argon2id 64 MiB, t=3. Voir src/lib/env.ts.
      - name: Build E2E + tests Playwright
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
