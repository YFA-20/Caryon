name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Permissions minimales : lecture seule + id-token pour OIDC Cloudflare.
# Les secrets Cloudflare ne sont PAS exposés aux PR issues de forks
# (GitHub masque automatiquement les secrets pour les forks).
permissions:
  contents: read
  id-token: write
  pull-requests: write # pour commenter l'URL de preview sur la PR

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Preview Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: https://${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (reproductible)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm run test

      - name: Build (export statique + CSP hashée)
        run: npm run build

      - name: Vérifier la CSP (hashes présents)
        run: |
          if ! grep -q "sha256-" out/_headers; then
            echo "::error::La CSP ne contient aucun hash SHA-256."
            exit 1
          fi

      - name: Déployer preview sur Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@39c2b5a1226e5718f92a2749a8988cce31e78a76 # v3.10.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=caryon --branch=pr-${{ github.event.pull_request.number }}

      - name: Commenter l'URL de preview sur la PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            const body = `🚀 **Preview déployée**\n\n${url}\n\n> ⚠️ Données fictives uniquement — l'app est local-first, aucune donnée réelle n'y transite.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
