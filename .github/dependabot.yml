# Velora — Dependabot (supply chain)
# Mises à jour groupées et limitées ; les dépendances critiques ne sont jamais
# fusionnées automatiquement en production sans tests (voir CONTRIBUTING.md §Supply chain).
version: 2
registries:
  npm:
    type: npm-registry
    url: https://registry.npmjs.org/

updates:
  # --- Application principale (racine) ---
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    groups:
      all-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    reviewers:
      - "YFA-20"
    labels:
      - "chore"
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: scope
    rebase-strategy: auto
    allow:
      - dependency-type: direct
      - dependency-type: indirect

  # --- Worker Cloudflare (Phase 3) ---
  - package-ecosystem: npm
    directory: "/worker"
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    groups:
      all-worker-deps:
        patterns: ["*"]
    reviewers:
      - "YFA-20"
    labels:
      - "chore"
      - "dependencies"
      - "worker"
    commit-message:
      prefix: "chore(deps-worker)"
      include: scope
    rebase-strategy: auto

  # --- GitHub Actions ---
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    reviewers:
      - "YFA-20"
    labels:
      - "chore"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    rebase-strategy: auto
