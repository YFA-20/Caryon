name: 🐛 Bug
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de décrire le bug. **N'incluez aucune donnée personnelle réelle** dans le rapport.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il ? Quel est le comportement attendu ?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. Aller sur …
        2. Cliquer sur …
        3. Constater …
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environnement
      placeholder: "Navigateur, OS, version de Velora (ex: Chrome 131, macOS 15, v0.1.0)"
    validations:
      required: true
  - type: textarea
    id: securite
    attributes:
      label: Impact sécurité potentiel
      description: Ce bug pourrait-il exposer des données, contourner un contrôle, ou affecter le chiffrement ?
    validations:
      required: false
